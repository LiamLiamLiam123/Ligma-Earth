<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ligma·Earth — Planetary Visualization</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg: #05070d;
    --panel: #0b1020cc;
    --panel-solid: #0d1322;
    --line: #1c2438;
    --teal: #55e0c6;
    --teal-dim: #2b8f7e;
    --amber: #ffb454;
    --text: #e9edf6;
    --muted: #7c8598;
    --danger: #ff6b6b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }
  #stage{ position:fixed; inset:0; cursor:grab; }
  #stage.dragging{ cursor:grabbing; }
  canvas.webgl{ display:block; width:100%; height:100%; }

  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }
  .display{ font-family:'Space Grotesk', sans-serif; }

  /* ---- Loading ---- */
  #loader{
    position:fixed; inset:0; z-index:100;
    background: var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  #loader.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .loader-ring{
    width:46px; height:46px; border-radius:50%;
    border: 2px solid var(--line);
    border-top-color: var(--teal);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loader .loadtext{ font-size:11px; letter-spacing:0.18em; color:var(--muted); text-transform:uppercase; }

  /* ---- Top bar ---- */
  #topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:18px;
    padding: 18px 22px;
    pointer-events:none;
  }
  .brand{
    display:flex; align-items:baseline; gap:9px;
    pointer-events:auto;
  }
  .brand-mark{
    width:11px; height:11px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #bfffee, var(--teal) 55%, var(--teal-dim));
    box-shadow: 0 0 12px 2px rgba(85,224,198,0.65);
    flex-shrink:0;
  }
  .brand-name{
    font-size:16px; font-weight:600; letter-spacing:0.01em;
  }
  .brand-name .dim{ color: var(--muted); font-weight:500; }
  .brand-tag{
    display:none;
    font-size:10.5px; color:var(--muted); letter-spacing:0.14em; text-transform:uppercase;
    border-left:1px solid var(--line); padding-left:12px; margin-left:2px;
  }
  @media(min-width:720px){ .brand-tag{ display:inline; } }

  #searchwrap{
    position:relative;
    flex:1; max-width:420px; margin:0 auto;
    pointer-events:auto;
  }
  #search{
    width:100%;
    background: var(--panel);
    backdrop-filter: blur(14px);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 14px 11px 38px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    outline:none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  #search::placeholder{ color:var(--muted); }
  #search:focus{ border-color: var(--teal-dim); box-shadow: 0 0 0 3px rgba(85,224,198,0.12); }
  #searchwrap .sicon{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; opacity:0.55; pointer-events:none;
  }
  #results{
    position:absolute; top:calc(100% + 8px); left:0; right:0;
    background: var(--panel-solid);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    max-height:0; opacity:0;
    transition: max-height 0.25s ease, opacity 0.2s ease;
  }
  #results.open{ max-height:260px; opacity:1; overflow-y:auto; }
  .result-item{
    padding:10px 14px; font-size:13px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1px solid var(--line);
  }
  .result-item:last-child{ border-bottom:none; }
  .result-item:hover, .result-item.active{ background: rgba(85,224,198,0.08); }
  .result-item .rc{ color:var(--muted); font-size:11px; }

  #menubtn{
    pointer-events:auto;
    width:38px; height:38px; border-radius:10px;
    background: var(--panel); border:1px solid var(--line);
    display:none; align-items:center; justify-content:center;
    color:var(--text); cursor:pointer;
  }

  /* ---- Right controls ---- */
  #controls{
    position:fixed; top:20px; right:22px; z-index:20;
    display:flex; flex-direction:column; gap:8px;
    align-items:flex-end;
  }
  .ctl-btn{
    pointer-events:auto;
    display:flex; align-items:center; gap:8px;
    background: var(--panel); backdrop-filter: blur(14px);
    border:1px solid var(--line); border-radius:10px;
    padding:9px 12px;
    font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--text); cursor:pointer; user-select:none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .ctl-btn:hover{ border-color: var(--teal-dim); }
  .ctl-btn .dot{ width:6px; height:6px; border-radius:50%; background:var(--muted); transition:background 0.2s; }
  .ctl-btn.on .dot{ background: var(--teal); box-shadow:0 0 8px 1px rgba(85,224,198,0.7); }
  .zoomgroup{ display:flex; gap:6px; }
  .zbtn{
    pointer-events:auto;
    width:34px; height:34px; border-radius:9px;
    background: var(--panel); border:1px solid var(--line);
    color:var(--text); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif;
  }
  .zbtn:hover{ border-color: var(--teal-dim); }
  .zbtn:active{ transform: scale(0.94); }

  /* ---- Bottom HUD ---- */
  #hud{
    position:fixed; left:22px; bottom:20px; z-index:20;
    background: var(--panel); backdrop-filter: blur(14px);
    border:1px solid var(--line); border-radius:12px;
    padding:12px 16px;
    pointer-events:none;
    min-width:190px;
  }
  #hud .hrow{ display:flex; justify-content:space-between; gap:18px; font-size:12px; padding:3px 0; }
  #hud .hlabel{ color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; font-size:10px; }
  #hud .hval{ color:var(--teal); }

  /* ---- Chips ---- */
  #chips{
    position:fixed; right:22px; bottom:20px; z-index:20;
    display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:60%;
  }
  .chip{
    pointer-events:auto;
    background: var(--panel); backdrop-filter: blur(14px);
    border:1px solid var(--line); border-radius:999px;
    padding:7px 13px; font-size:11.5px; cursor:pointer;
    color:var(--muted); transition: all 0.15s ease;
  }
  .chip:hover{ color:var(--text); border-color:var(--teal-dim); }

  /* ---- Marker tooltip ---- */
  #tooltip{
    position:fixed; z-index:30; pointer-events:none;
    background: var(--panel-solid); border:1px solid var(--line);
    border-radius:8px; padding:6px 10px; font-size:12px;
    transform: translate(-50%, -130%);
    opacity:0; transition: opacity 0.12s ease;
    white-space:nowrap;
  }
  #tooltip.show{ opacity:1; }
  #tooltip .tc{ color:var(--muted); font-size:10.5px; }

  /* ---- Footer credit ---- */
  #credit{
    position:fixed; left:50%; bottom:8px; transform:translateX(-50%);
    font-size:9.5px; color:#3a4258; letter-spacing:0.08em; z-index:15;
    pointer-events:none; text-transform:uppercase;
  }

  @media (max-width: 720px){
    #topbar{ padding:14px; gap:10px; }
    .brand-name{ font-size:14px; }
    #chips{ display:none; }
    #hud{ padding:10px 12px; min-width:150px; left:14px; bottom:14px; }
    #controls{ right:14px; top:14px; }
    .ctl-btn span.label{ display:none; }
  }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-ring"></div>
  <div class="loadtext mono">Initializing planetary data</div>
</div>

<div id="stage">
  <canvas class="webgl"></canvas>
</div>

<div id="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name display">LIGMA<span class="dim">·</span>EARTH</span>
    <span class="brand-tag mono">Planetary Visualization Platform</span>
  </div>
  <div id="searchwrap">
    <svg class="sicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" class="mono" type="text" placeholder="Search a city, anywhere..." autocomplete="off">
    <div id="results"></div>
  </div>
</div>

<div id="controls">
  <div class="ctl-btn" id="nightToggle"><span class="dot"></span><span class="label">Night lights</span></div>
  <div class="ctl-btn" id="resetBtn"><span class="label">Reset view</span></div>
  <div class="zoomgroup">
    <div class="zbtn" id="zoomIn">+</div>
    <div class="zbtn" id="zoomOut">&minus;</div>
  </div>
</div>

<div id="hud" class="mono">
  <div class="hrow"><span class="hlabel">Lat</span><span class="hval" id="hudLat">00.00° N</span></div>
  <div class="hrow"><span class="hlabel">Lon</span><span class="hval" id="hudLon">000.00° E</span></div>
  <div class="hrow"><span class="hlabel">Altitude</span><span class="hval" id="hudZoom">100%</span></div>
</div>

<div id="chips"></div>
<div id="tooltip" class="mono"></div>
<div id="credit">Ligma·Earth &mdash; vector-rendered planetary model &mdash; not affiliated with anyone official, ever</div>

const CITY_DATA = [["Sydney","Australia",-33.8688,151.2093],["Melbourne","Australia",-37.8136,144.9631],["Tokyo","Japan",35.6762,139.6503],["Seoul","South Korea",37.5665,126.978],["Beijing","China",39.9042,116.4074],["Shanghai","China",31.2304,121.4737],["Hong Kong","China",22.3193,114.1694],["Singapore","Singapore",1.3521,103.8198],["Bangkok","Thailand",13.7563,100.5018],["Jakarta","Indonesia",-6.2088,106.8456],["Mumbai","India",19.076,72.8777],["New Delhi","India",28.6139,77.209],["Dubai","UAE",25.2048,55.2708],["Istanbul","Turkey",41.0082,28.9784],["Moscow","Russia",55.7558,37.6173],["Cairo","Egypt",30.0444,31.2357],["Nairobi","Kenya",-1.2921,36.8219],["Lagos","Nigeria",6.5244,3.3792],["Cape Town","South Africa",-33.9249,18.4241],["Johannesburg","South Africa",-26.2041,28.0473],["London","United Kingdom",51.5074,-0.1278],["Paris","France",48.8566,2.3522],["Berlin","Germany",52.52,13.405],["Rome","Italy",41.9028,12.4964],["Madrid","Spain",40.4168,-3.7038],["Amsterdam","Netherlands",52.3676,4.9041],["Stockholm","Sweden",59.3293,18.0686],["Athens","Greece",37.9838,23.7275],["Vienna","Austria",48.2082,16.3738],["Zurich","Switzerland",47.3769,8.5417],["New York","USA",40.7128,-74.006],["Los Angeles","USA",34.0522,-118.2437],["Chicago","USA",41.8781,-87.6298],["San Francisco","USA",37.7749,-122.4194],["Toronto","Canada",43.6532,-79.3832],["Vancouver","Canada",49.2827,-123.1207],["Mexico City","Mexico",19.4326,-99.1332],["Sao Paulo","Brazil",-23.5505,-46.6333],["Rio de Janeiro","Brazil",-22.9068,-43.1729],["Buenos Aires","Argentina",-34.6037,-58.3816],["Lima","Peru",-12.0464,-77.0428],["Santiago","Chile",-33.4489,-70.6693],["Bogota","Colombia",4.711,-74.0721],["Auckland","New Zealand",-36.8485,174.7633],["Perth","Australia",-31.9505,115.8605],["Brisbane","Australia",-27.4698,153.0251],["Reykjavik","Iceland",64.1466,-21.9426],["Lisbon","Portugal",38.7223,-9.1393],["Dublin","Ireland",53.3498,-6.2603],["Warsaw","Poland",52.2297,21.0122],["Helsinki","Finland",60.1699,24.938 <script>
(function(){

// ============================================================
// SCENE SETUP
// ============================================================
const canvas = document.querySelector('canvas.webgl');
const stage = document.getElementById('stage');
const scene = new THREE.Scene();

const RADIUS = 2;
let W = window.innerWidth, H = window.innerHeight;

const camera = new THREE.PerspectiveCamera(42, W/H, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// ============================================================
// TEXTURE GENERATION (procedural vector world map)
// ============================================================
const TW = 2048, TH = 1024;

function project(lon, lat){
  return [ (lon+180)/360*TW, (90-lat)/180*TH ];
}

function splitRing(ring){
  // split ring into segments where longitude wraps around the antimeridian
  const segs = [];
  let cur = [ring[0]];
  for(let i=1;i<ring.length;i++){
    const prev = ring[i-1], p = ring[i];
    if(Math.abs(p[0]-prev[0]) > 180){
      if(cur.length>=2) segs.push(cur);
      cur = [p];
    } else {
      cur.push(p);
    }
  }
  if(cur.length>=2) segs.push(cur);
  return segs;
}

function drawGraticule(ctx, color){
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.35;
  for(let lon=-180; lon<=180; lon+=20){
    const [x] = project(lon, 0);
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,TH); ctx.stroke();
  }
  for(let lat=-80; lat<=80; lat+=20){
    const [,y] = project(0, lat);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(TW,y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function buildTexture(mode){
  const cvs = document.createElement('canvas');
  cvs.width = TW; cvs.height = TH;
  const ctx = cvs.getContext('2d');

  if(mode === 'day'){
    const grad = ctx.createLinearGradient(0,0,0,TH);
    grad.addColorStop(0, '#0a1a2e');
    grad.addColorStop(0.5, '#08182c');
    grad.addColorStop(1, '#0a1a2e');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,TW,TH);
    drawGraticule(ctx, '#1c3a52');

    RING_DATA.forEach(ring=>{
      splitRing(ring).forEach(seg=>{
        if(seg.length<3) return;
        ctx.beginPath();
        seg.forEach((p,i)=>{
          const [x,y] = project(p[0],p[1]);
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,180,84,0.13)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,180,84,0.85)';
        ctx.lineWidth = 1.15;
        ctx.stroke();
      });
    });
  } else {
    // night mode
    ctx.fillStyle = '#03060c';
    ctx.fillRect(0,0,TW,TH);
    drawGraticule(ctx, '#132234');

    RING_DATA.forEach(ring=>{
      splitRing(ring).forEach(seg=>{
        if(seg.length<3) return;
        ctx.beginPath();
        seg.forEach((p,i)=>{
          const [x,y] = project(p[0],p[1]);
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.closePath();
        ctx.fillStyle = 'rgba(10,14,24,0.9)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(85,224,198,0.55)';
        ctx.lineWidth = 1;
        ctx.stroke();
      });
    });

    // city light glows
    CITY_DATA.forEach(c=>{
      const [x,y] = project(c[3], c[2]);
      const r = 18 + Math.random()*10;
      const g = ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0, 'rgba(255,214,140,0.9)');
      g.addColorStop(0.3, 'rgba(255,180,84,0.35)');
      g.addColorStop(1, 'rgba(255,180,84,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      // scatter small dots nearby for texture
      for(let i=0;i<10;i++){
        const dx = x + (Math.random()-0.5)*40;
        const dy = y + (Math.random()-0.5)*22;
        const rr = Math.random()*1.6+0.4;
        ctx.fillStyle = 'rgba(255,214,150,'+(0.35+Math.random()*0.4)+')';
        ctx.beginPath(); ctx.arc(dx,dy,rr,0,Math.PI*2); ctx.fill();
      }
    });
  }

  const tex = new THREE.CanvasTexture(cvs);
  tex.needsUpdate = true;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const dayTexture = buildTexture('day');
const nightTexture = buildTexture('night');

// ============================================================
// GLOBE
// ============================================================
const globeGroup = new THREE.Group();
scene.add(globeGroup);

const globeGeo = new THREE.SphereGeometry(RADIUS, 96, 96);
const globeMat = new THREE.MeshBasicMaterial({ map: dayTexture });
const globe = new THREE.Mesh(globeGeo, globeMat);
globeGroup.add(globe);

// subtle inner core glow (visible at grazing angles through gaps)
const coreGeo = new THREE.SphereGeometry(RADIUS*0.985, 64, 64);
const coreMat = new THREE.MeshBasicMaterial({ color: 0x03050a });
globeGroup.add(new THREE.Mesh(coreGeo, coreMat));

// atmosphere rim glow
const atmoVert = `
  varying vec3 vNormal;
  varying vec3 vViewDir;
  void main(){
    vNormal = normalize( normalMatrix * normal );
    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
    vViewDir = normalize(-mvPos.xyz);
    gl_Position = projectionMatrix * mvPos;
  }
`;
const atmoFrag = `
  varying vec3 vNormal;
  varying vec3 vViewDir;
  uniform vec3 glowColor;
  void main(){
    float intensity = pow(0.62 - dot(vNormal, vViewDir), 2.8);
    gl_FragColor = vec4(glowColor, 1.0) * intensity;
  }
`;
const atmoMat = new THREE.ShaderMaterial({
  vertexShader: atmoVert,
  fragmentShader: atmoFrag,
  uniforms: { glowColor: { value: new THREE.Color(0x55e0c6) } },
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true,
  depthWrite: false
});
const atmo = new THREE.Mesh(new THREE.SphereGeometry(RADIUS*1.18, 64, 64), atmoMat);
scene.add(atmo);

// thin crisp edge ring
const edgeMat = new THREE.ShaderMaterial({
  vertexShader: atmoVert,
  fragmentShader: `
    varying vec3 vNormal; varying vec3 vViewDir; uniform vec3 glowColor;
    void main(){
      float intensity = pow(0.985 - abs(dot(vNormal, vViewDir)), 12.0);
      gl_FragColor = vec4(glowColor, 1.0) * intensity * 1.4;
    }`,
  uniforms: { glowColor: { value: new THREE.Color(0x9be9d8) } },
  blending: THREE.AdditiveBlending, side: THREE.FrontSide, transparent:true, depthWrite:false
});
const edge = new THREE.Mesh(new THREE.SphereGeometry(RADIUS*1.003, 96, 96), edgeMat);
scene.add(edge);

// ============================================================
// STARFIELD
// ============================================================
function buildStars(count, spread){
  const positions = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r = spread * (0.6 + Math.random()*0.4);
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos((Math.random()*2)-1);
    positions[i*3] = r*Math.sin(phi)*Math.cos(theta);
    positions[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
    positions[i*3+2] = r*Math.cos(phi);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const mat = new THREE.PointsMaterial({ color:0xffffff, size:0.018, transparent:true, opacity:0.75, sizeAttenuation:true });
  return new THREE.Points(geo, mat);
}
scene.add(buildStars(3600, 40));
scene.add(buildStars(1200, 18));

// ============================================================
// CITY MARKERS
// ============================================================
function latLonToVec3(lat, lon, r){
  const phi = (90-lat) * Math.PI/180;
  const theta = (lon+180) * Math.PI/180;
  return new THREE.Vector3(
    -r*Math.sin(phi)*Math.cos(theta),
     r*Math.cos(phi),
     r*Math.sin(phi)*Math.sin(theta)
  );
}

function dotTexture(){
  const c = document.createElement('canvas'); c.width=64; c.height=64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.25,'rgba(85,224,198,0.9)');
  g.addColorStop(1,'rgba(85,224,198,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
const markerTex = dotTexture();

const markers = [];
CITY_DATA.forEach(c=>{
  const [name, country, lat, lon] = c;
  const pos = latLonToVec3(lat, lon, RADIUS*1.005);
  const mat = new THREE.SpriteMaterial({ map: markerTex, color:0x55e0c6, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
  const spr = new THREE.Sprite(mat);
  spr.position.copy(pos);
  spr.scale.set(0.05,0.05,0.05);
  spr.userData = { name, country, lat, lon };
  globeGroup.add(spr);
  markers.push(spr);
});

// highlight marker (currently selected)
const selMat = new THREE.SpriteMaterial({ map: markerTex, color:0xffb454, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
const selSprite = new THREE.Sprite(selMat);
selSprite.scale.set(0.09,0.09,0.09);
selSprite.visible = false;
globeGroup.add(selSprite);

// ============================================================
// CAMERA ORBIT STATE
// ============================================================
let theta = (151.2093+180) * Math.PI/180;   // start facing Sydney-ish longitude
let phi = (90-(-33.8688)) * Math.PI/180;
let radius = 5.2;
const MIN_R = RADIUS*1.35, MAX_R = RADIUS*3.4;
const PHI_EPS = 0.12;

let targetTheta = theta, targetPhi = phi, targetRadius = radius;
let flying = false;

function updateCameraPosition(){
  const p = Math.max(PHI_EPS, Math.min(Math.PI-PHI_EPS, phi));
  camera.position.set(
    -radius*Math.sin(p)*Math.cos(theta),
     radius*Math.cos(p),
     radius*Math.sin(p)*Math.sin(theta)
  );
  camera.up.set(0,1,0);
  camera.lookAt(0,0,0);
}
updateCameraPosition();

function normalizeAngle(a){
  while(a > Math.PI) a -= Math.PI*2;
  while(a < -Math.PI) a += Math.PI*2;
  return a;
}

// ============================================================
// INTERACTION: drag to orbit, wheel to zoom, inertia
// ============================================================
let dragging = false, lastX=0, lastY=0;
let velTheta=0, velPhi=0;
const ROT_SPEED = 0.0055;

function pointerDown(x,y){
  dragging = true; flying=false;
  lastX=x; lastY=y;
  velTheta=0; velPhi=0;
  stage.classList.add('dragging');
}
function pointerMove(x,y){
  if(!dragging) return;
  const dx = x-lastX, dy = y-lastY;
  targetTheta += dx*ROT_SPEED;
  targetPhi -= dy*ROT_SPEED;
  targetPhi = Math.max(PHI_EPS, Math.min(Math.PI-PHI_EPS, targetPhi));
  velTheta = dx*ROT_SPEED;
  velPhi = -dy*ROT_SPEED;
  lastX=x; lastY=y;
}
function pointerUp(){
  dragging=false;
  stage.classList.remove('dragging');
}

canvas.addEventListener('mousedown', e=>pointerDown(e.clientX,e.clientY));
window.addEventListener('mousemove', e=>pointerMove(e.clientX,e.clientY));
window.addEventListener('mouseup', pointerUp);

canvas.addEventListener('touchstart', e=>{
  if(e.touches.length===1) pointerDown(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:true});
canvas.addEventListener('touchmove', e=>{
  if(e.touches.length===1) pointerMove(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:true});
canvas.addEventListener('touchend', pointerUp);

canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  targetRadius += e.deltaY * 0.0022 * targetRadius*0.5;
  targetRadius = Math.max(MIN_R, Math.min(MAX_R, targetRadius));
  flying=false;
}, {passive:false});

document.getElementById('zoomIn').addEventListener('click', ()=>{
  targetRadius = Math.max(MIN_R, targetRadius - (MAX_R-MIN_R)*0.18);
  flying=false;
});
document.getElementById('zoomOut').addEventListener('click', ()=>{
  targetRadius = Math.min(MAX_R, targetRadius + (MAX_R-MIN_R)*0.18);
  flying=false;
});

const DEFAULT = { theta:(151.2093+180)*Math.PI/180, phi:(90-(-33.8688))*Math.PI/180, radius:5.2 };
document.getElementById('resetBtn').addEventListener('click', ()=>{
  flyToAngles(DEFAULT.theta, DEFAULT.phi, DEFAULT.radius);
  selSprite.visible = false;
});

function flyToAngles(t, p, r){
  flying = true;
  dragging = false;
  let diff = normalizeAngle(t - targetTheta);
  targetTheta = targetTheta + diff;
  targetPhi = p;
  targetRadius = r;
}

function flyToCity(city){
  const [name, country, lat, lon] = city;
  const phiT = (90-lat)*Math.PI/180;
  const thetaT = (lon+180)*Math.PI/180;
  flyToAngles(thetaT, phiT, RADIUS*1.7);
  selSprite.position.copy(latLonToVec3(lat, lon, RADIUS*1.01));
  selSprite.visible = true;
}

// ============================================================
// NIGHT MODE TOGGLE
// ============================================================
let nightMode = false;
const nightToggle = document.getElementById('nightToggle');
nightToggle.addEventListener('click', ()=>{
  nightMode = !nightMode;
  nightToggle.classList.toggle('on', nightMode);
  globeMat.map = nightMode ? nightTexture : dayTexture;
  globeMat.needsUpdate = true;
  atmoMat.uniforms.glowColor.value.set(nightMode ? 0x2f6f8f : 0x55e0c6);
  edgeMat.uniforms.glowColor.value.set(nightMode ? 0x6fb8d8 : 0x9be9d8);
});

// ============================================================
// SEARCH
// ============================================================
const searchInput = document.getElementById('search');
const resultsBox = document.getElementById('results');

function renderResults(list){
  resultsBox.innerHTML = '';
  if(list.length===0){ resultsBox.classList.remove('open'); return; }
  list.slice(0,8).forEach(c=>{
    const div = document.createElement('div');
    div.className = 'result-item';
    div.innerHTML = `<span>${c[0]}</span><span class="rc mono">${c[1]}</span>`;
    div.addEventListener('click', ()=>{
      flyToCity(c);
      searchInput.value = c[0];
      resultsBox.classList.remove('open');
    });
    resultsBox.appendChild(div);
  });
  resultsBox.classList.add('open');
}

searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim().toLowerCase();
  if(q.length===0){ resultsBox.classList.remove('open'); return; }
  const matches = CITY_DATA.filter(c => c[0].toLowerCase().includes(q) || c[1].toLowerCase().includes(q));
  renderResults(matches);
});
searchInput.addEventListener('focus', ()=>{
  if(searchInput.value.trim().length>0) renderResults(CITY_DATA.filter(c=>c[0].toLowerCase().includes(searchInput.value.trim().toLowerCase())));
});
document.addEventListener('click', (e)=>{
  if(!document.getElementById('searchwrap').contains(e.target)) resultsBox.classList.remove('open');
});
searchInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const q = searchInput.value.trim().toLowerCase();
    const match = CITY_DATA.find(c=>c[0].toLowerCase().includes(q));
    if(match){ flyToCity(match); resultsBox.classList.remove('open'); }
  }
});

// ============================================================
// QUICK CHIPS
// ============================================================
const chipNames = ['Sydney','Tokyo','London','New York','Paris','Dubai'];
const chipsEl = document.getElementById('chips');
chipNames.forEach(n=>{
  const c = CITY_DATA.find(c=>c[0]===n);
  if(!c) return;
  const el = document.createElement('div');
  el.className = 'chip mono';
  el.textContent = n;
  el.addEventListener('click', ()=> flyToCity(c));
  chipsEl.appendChild(el);
});

// ============================================================
// HOVER TOOLTIP (raycasting)
// ============================================================
const raycaster = new THREE.Raycaster();
raycaster.params.Sprite = { threshold: 0.06 };
const mouseNDC = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let hovered = null;

canvas.addEventListener('mousemove', e=>{
  mouseNDC.x = (e.clientX/W)*2-1;
  mouseNDC.y = -(e.clientY/H)*2+1;
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObjects(markers);
  if(hits.length>0){
    const m = hits[0].object;
    hovered = m;
    const d = m.userData;
    tooltip.innerHTML = `<b>${d.name}</b> <span class="tc">${d.country}</span>`;
    tooltip.style.left = e.clientX+'px';
    tooltip.style.top = e.clientY+'px';
    tooltip.classList.add('show');
    stage.style.cursor = 'pointer';
  } else {
    hovered = null;
    tooltip.classList.remove('show');
    stage.style.cursor = dragging ? 'grabbing' : 'grab';
  }
});
canvas.addEventListener('click', ()=>{
  if(hovered){
    const d = hovered.userData;
    flyToCity([d.name, d.country, d.lat, d.lon]);
    searchInput.value = d.name;
  }
});

// ============================================================
// HUD UPDATE
// ============================================================
const hudLat = document.getElementById('hudLat');
const hudLon = document.getElementById('hudLon');
const hudZoom = document.getElementById('hudZoom');

function fmtLat(v){ return Math.abs(v).toFixed(2)+'° '+(v>=0?'N':'S'); }
function fmtLon(v){ return Math.abs(v).toFixed(2)+'° '+(v>=0?'E':'W'); }

function updateHud(){
  const p = Math.max(PHI_EPS, Math.min(Math.PI-PHI_EPS, phi));
  const lat = 90 - p*180/Math.PI;
  let lon = theta*180/Math.PI - 180;
  lon = ((lon+180)%360+360)%360 - 180;
  hudLat.textContent = fmtLat(lat);
  hudLon.textContent = fmtLon(lon);
  const zoomPct = Math.round( (1 - (radius-MIN_R)/(MAX_R-MIN_R)) * 100 );
  hudZoom.textContent = zoomPct + '%';
}

// ============================================================
// RENDER LOOP
// ============================================================
function animate(){
  requestAnimationFrame(animate);

  if(flying){
    const diff = normalizeAngle(targetTheta - theta);
    theta += diff * 0.07;
    phi += (targetPhi - phi) * 0.07;
    radius += (targetRadius - radius) * 0.09;
    if(Math.abs(diff) < 0.0008 && Math.abs(targetPhi-phi) < 0.0008 && Math.abs(targetRadius-radius) < 0.004){
      flying = false;
    }
  } else if(dragging){
    theta += normalizeAngle(targetTheta - theta) * 0.4;
    phi += (targetPhi - phi) * 0.4;
    radius += (targetRadius - radius) * 0.15;
  } else {
    // inertia
    targetTheta += velTheta;
    targetPhi = Math.max(PHI_EPS, Math.min(Math.PI-PHI_EPS, targetPhi + velPhi));
    velTheta *= 0.94; velPhi *= 0.94;
    if(Math.abs(velTheta) < 0.00003) velTheta = 0;
    if(Math.abs(velPhi) < 0.00003) velPhi = 0;
    theta += normalizeAngle(targetTheta - theta) * 0.18;
    phi += (targetPhi - phi) * 0.18;
    radius += (targetRadius - radius) * 0.12;
  }

  updateCameraPosition();
  updateHud();
  renderer.render(scene, camera);
}

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', ()=>{
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W/H;
  camera.updateProjectionMatrix();
  renderer.setSize(W,H);
});

// ============================================================
// BOOT
// ============================================================
setTimeout(()=>{
  document.getElementById('loader').classList.add('hidden');
  animate();
}, 420);

})();
</script>
